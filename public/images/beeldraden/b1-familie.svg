<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Een familie zit samen aan de eettafel voor het avondeten">
  <!-- achtergrond -->
  <rect width="800" height="600" fill="#fef3c7"/>
  <!-- vloer -->
  <rect x="0" y="480" width="800" height="120" fill="#d6d3d1"/>
  <!-- muur schilderij -->
  <rect x="300" y="60" width="200" height="140" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="6"/>
  <circle cx="400" cy="130" r="40" fill="#4ade80"/>
  <ellipse cx="400" cy="160" rx="25" ry="35" fill="#86efac"/>
  <!-- lamp -->
  <line x1="400" y1="0" x2="400" y2="80" stroke="#374151" stroke-width="4"/>
  <path d="M340,80 Q400,110 460,80" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="400" cy="82" rx="60" ry="12" fill="#fde047" opacity="0.6"/>
  <!-- tafel -->
  <ellipse cx="400" cy="430" rx="280" ry="60" fill="#92400e"/>
  <ellipse cx="400" cy="420" rx="280" ry="55" fill="#b45309"/>
  <!-- tafelpoten -->
  <rect x="180" y="450" width="20" height="120" fill="#78350f"/>
  <rect x="600" y="450" width="20" height="120" fill="#78350f"/>
  <!-- borden en eten op tafel -->
  <circle cx="260" cy="408" r="36" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <ellipse cx="260" cy="405" rx="26" ry="22" fill="#f97316" opacity="0.7"/>
  <circle cx="400" cy="400" r="36" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <ellipse cx="400" cy="397" rx="26" ry="22" fill="#4ade80" opacity="0.8"/>
  <circle cx="540" cy="408" r="36" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <ellipse cx="540" cy="405" rx="26" ry="22" fill="#fbbf24" opacity="0.8"/>
  <!-- glazen -->
  <rect x="310" y="385" width="16" height="28" rx="3" fill="#bae6fd" opacity="0.8"/>
  <rect x="474" y="385" width="16" height="28" rx="3" fill="#bae6fd" opacity="0.8"/>
  <!-- persoon 1 links – kind -->
  <circle cx="140" cy="360" r="28" fill="#fbbf24"/>
  <!-- haar kind -->
  <rect x="116" y="340" width="48" height="16" rx="8" fill="#92400e"/>
  <rect x="110" y="348" width="10" height="22" rx="5" fill="#92400e"/>
  <rect x="154" y="348" width="10" height="22" rx="5" fill="#92400e"/>
  <rect x="140" y="386" width="34" height="50" rx="8" fill="#ef4444"/>
  <!-- persoon 2 volwassene links -->
  <circle cx="240" cy="330" r="36" fill="#fca5a5"/>
  <!-- haar -->
  <ellipse cx="240" cy="305" rx="36" ry="18" fill="#7c2d12"/>
  <rect x="204" y="305" width="14" height="34" rx="7" fill="#7c2d12"/>
  <rect x="222" y="364" width="36" height="60" rx="8" fill="#7c3aed"/>
  <!-- persoon 3 midden -->
  <circle cx="400" cy="300" r="36" fill="#fdba74"/>
  <rect x="364" y="334" width="72" height="70" rx="8" fill="#2563eb"/>
  <!-- persoon 4 rechts -->
  <circle cx="560" cy="330" r="36" fill="#a78bfa"/>
  <rect x="524" y="364" width="36" height="60" rx="8" fill="#16a34a"/>
  <!-- persoon 5 rechts – kind -->
  <circle cx="660" cy="360" r="28" fill="#fde047"/>
  <rect x="636" y="386" width="34" height="50" rx="8" fill="#f97316"/>
  <!-- armen uitgestrekt -->
  <line x1="140" y1="395" x2="100" y2="420" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="660" y1="395" x2="700" y2="420" stroke="#fde047" stroke-width="8" stroke-linecap="round"/>
</svg>
