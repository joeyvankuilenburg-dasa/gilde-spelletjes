<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Een kat zit op een vensterbank">
  <!-- achtergrond kamer -->
  <rect width="800" height="600" fill="#fef9c3"/>
  <!-- muur -->
  <rect width="800" height="600" fill="#fef3c7"/>
  <!-- raam -->
  <rect x="200" y="80" width="400" height="320" rx="8" fill="#bae6fd" stroke="#6b7280" stroke-width="6"/>
  <line x1="400" y1="80" x2="400" y2="400" stroke="#6b7280" stroke-width="4"/>
  <line x1="200" y1="240" x2="600" y2="240" stroke="#6b7280" stroke-width="4"/>
  <!-- buiten (door raam) -->
  <rect x="206" y="86" width="188" height="148" fill="#86efac"/>
  <rect x="406" y="86" width="188" height="148" fill="#86efac"/>
  <rect x="206" y="246" width="188" height="148" fill="#93c5fd"/>
  <rect x="406" y="246" width="188" height="148" fill="#93c5fd"/>
  <!-- zon door raam -->
  <circle cx="480" cy="160" r="40" fill="#fde047"/>
  <!-- vensterbank -->
  <rect x="140" y="395" width="520" height="30" rx="4" fill="#d1d5db"/>
  <!-- kat lichaam -->
  <ellipse cx="400" cy="410" rx="70" ry="45" fill="#f97316"/>
  <!-- kat kop -->
  <circle cx="400" cy="355" r="48" fill="#f97316"/>
  <!-- oren -->
  <polygon points="360,325 345,295 385,310" fill="#f97316"/>
  <polygon points="440,325 455,295 415,310" fill="#f97316"/>
  <polygon points="362,322 349,298 380,312" fill="#fca5a5"/>
  <polygon points="438,322 451,298 420,312" fill="#fca5a5"/>
  <!-- ogen -->
  <ellipse cx="382" cy="350" rx="12" ry="14" fill="#1f2937"/>
  <ellipse cx="418" cy="350" rx="12" ry="14" fill="#1f2937"/>
  <circle cx="386" cy="347" r="4" fill="white"/>
  <circle cx="422" cy="347" r="4" fill="white"/>
  <!-- neus -->
  <ellipse cx="400" cy="368" rx="6" ry="4" fill="#fca5a5"/>
  <!-- mond -->
  <path d="M394,372 Q400,378 406,372" stroke="#374151" stroke-width="2" fill="none"/>
  <!-- snorren -->
  <line x1="355" y1="368" x2="390" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="355" y1="375" x2="390" y2="373" stroke="#374151" stroke-width="2"/>
  <line x1="410" y1="370" x2="445" y2="368" stroke="#374151" stroke-width="2"/>
  <line x1="410" y1="373" x2="445" y2="375" stroke="#374151" stroke-width="2"/>
  <!-- staart -->
  <path d="M465,420 Q530,390 510,440 Q490,470 460,450" stroke="#f97316" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- pootjes -->
  <ellipse cx="360" cy="448" rx="22" ry="12" fill="#fb923c"/>
  <ellipse cx="440" cy="448" rx="22" ry="12" fill="#fb923c"/>
</svg>
