<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Een Hollandse gracht met grachtenpanden en fietsen op de brug">
  <!-- lucht -->
  <rect width="800" height="600" fill="#bae6fd"/>
  <!-- wolken -->
  <ellipse cx="200" cy="80" rx="100" ry="40" fill="white" opacity="0.9"/>
  <ellipse cx="260" cy="68" rx="80" ry="36" fill="white" opacity="0.9"/>
  <ellipse cx="580" cy="100" rx="110" ry="44" fill="white" opacity="0.9"/>
  <!-- water -->
  <rect x="0" y="380" width="800" height="220" fill="#0ea5e9"/>
  <!-- watergolven -->
  <path d="M0,400 Q100,390 200,400 Q300,410 400,400 Q500,390 600,400 Q700,410 800,400" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M0,430 Q100,420 200,430 Q300,440 400,430 Q500,420 600,430 Q700,440 800,430" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <!-- kade links -->
  <rect x="0" y="340" width="200" height="45" fill="#6b7280"/>
  <!-- kade rechts -->
  <rect x="600" y="340" width="200" height="45" fill="#6b7280"/>
  <!-- brug -->
  <rect x="170" y="345" width="460" height="30" rx="4" fill="#9ca3af"/>
  <path d="M170,375 Q400,320 630,375" fill="#d1d5db" stroke="#9ca3af" stroke-width="4"/>
  <!-- brugbalustrade -->
  <line x1="200" y1="345" x2="200" y2="320" stroke="#6b7280" stroke-width="4"/>
  <line x1="250" y1="338" x2="250" y2="315" stroke="#6b7280" stroke-width="4"/>
  <line x1="300" y1="333" x2="300" y2="312" stroke="#6b7280" stroke-width="4"/>
  <line x1="350" y1="330" x2="350" y2="310" stroke="#6b7280" stroke-width="4"/>
  <line x1="400" y1="328" x2="400" y2="308" stroke="#6b7280" stroke-width="4"/>
  <line x1="450" y1="330" x2="450" y2="310" stroke="#6b7280" stroke-width="4"/>
  <line x1="500" y1="333" x2="500" y2="312" stroke="#6b7280" stroke-width="4"/>
  <line x1="550" y1="338" x2="550" y2="315" stroke="#6b7280" stroke-width="4"/>
  <line x1="600" y1="345" x2="600" y2="320" stroke="#6b7280" stroke-width="4"/>
  <line x1="200" y1="320" x2="600" y2="320" stroke="#6b7280" stroke-width="3"/>
  <!-- fiets op brug -->
  <circle cx="360" cy="335" r="14" fill="none" stroke="#374151" stroke-width="4"/>
  <circle cx="400" cy="335" r="14" fill="none" stroke="#374151" stroke-width="4"/>
  <line x1="360" y1="335" x2="380" y2="320" stroke="#374151" stroke-width="4"/>
  <line x1="380" y1="320" x2="400" y2="335" stroke="#374151" stroke-width="4"/>
  <line x1="380" y1="320" x2="380" y2="310" stroke="#374151" stroke-width="3"/>
  <!-- grachtenpand links -->
  <rect x="0" y="100" width="155" height="245" fill="#b45309"/>
  <rect x="0" y="88" width="160" height="20" fill="#92400e"/>
  <!-- ramen links -->
  <rect x="20" y="130" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <rect x="80" y="130" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <rect x="20" y="210" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <rect x="80" y="210" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <rect x="20" y="290" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <rect x="80" y="290" width="40" height="50" rx="3" fill="#bae6fd" stroke="#78350f" stroke-width="2"/>
  <!-- deur links -->
  <rect x="55" y="300" width="50" height="85" rx="4" fill="#1e3a5f"/>
  <circle cx="98" cy="344" r="5" fill="#fbbf24"/>
  <!-- grachtenpand rechts -->
  <rect x="645" y="120" width="155" height="225" fill="#dc2626"/>
  <rect x="640" y="108" width="160" height="20" fill="#b91c1c"/>
  <!-- trapgevel rechts -->
  <polygon points="640,108 720,40 800,108" fill="#b91c1c"/>
  <rect x="700" y="55" width="40" height="55" rx="3" fill="#bae6fd" stroke="#b91c1c" stroke-width="2"/>
  <!-- ramen rechts -->
  <rect x="660" y="150" width="40" height="50" rx="3" fill="#bae6fd" stroke="#b91c1c" stroke-width="2"/>
  <rect x="720" y="150" width="40" height="50" rx="3" fill="#bae6fd" stroke="#b91c1c" stroke-width="2"/>
  <rect x="660" y="230" width="40" height="50" rx="3" fill="#bae6fd" stroke="#b91c1c" stroke-width="2"/>
  <rect x="720" y="230" width="40" height="50" rx="3" fill="#bae6fd" stroke="#b91c1c" stroke-width="2"/>
  <!-- deur rechts -->
  <rect x="695" y="295" width="50" height="85" rx="4" fill="#1e3a5f"/>
  <circle cx="702" cy="344" r="5" fill="#fbbf24"/>
  <!-- boot in het water -->
  <path d="M280,420 L520,420 L500,460 L300,460 Z" fill="#16a34a"/>
  <rect x="370" y="380" width="60" height="42" rx="3" fill="#f0fdf4"/>
  <rect x="376" y="386" width="20" height="24" rx="2" fill="#bae6fd"/>
  <rect x="404" y="386" width="20" height="24" rx="2" fill="#bae6fd"/>
  <!-- weerspiegeling -->
  <rect x="280" y="460" width="240" height="30" fill="#0ea5e9" opacity="0.5"/>
</svg>
