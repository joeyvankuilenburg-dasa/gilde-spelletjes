<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Een speeltuin met een glijbaan, schommels en spelende kinderen">
  <rect width="800" height="600" fill="#bae6fd"/>
  <!-- gras -->
  <rect x="0" y="420" width="800" height="180" fill="#4ade80"/>
  <!-- wolken -->
  <ellipse cx="150" cy="100" rx="80" ry="40" fill="white"/>
  <ellipse cx="200" cy="85" rx="70" ry="38" fill="white"/>
  <ellipse cx="100" cy="90" rx="60" ry="32" fill="white"/>
  <ellipse cx="600" cy="120" rx="90" ry="42" fill="white"/>
  <ellipse cx="650" cy="105" rx="75" ry="38" fill="white"/>
  <!-- glijbaan frame -->
  <rect x="180" y="200" width="16" height="220" fill="#dc2626"/>
  <rect x="300" y="200" width="16" height="220" fill="#dc2626"/>
  <rect x="180" y="200" width="136" height="16" fill="#dc2626"/>
  <!-- platform -->
  <rect x="176" y="240" width="144" height="18" fill="#f97316"/>
  <!-- glijbaan -->
  <polygon points="196,258 308,258 400,418 310,418" fill="#fbbf24"/>
  <line x1="196" y1="258" x2="310" y2="418" stroke="#f59e0b" stroke-width="4"/>
  <line x1="308" y1="258" x2="400" y2="418" stroke="#f59e0b" stroke-width="4"/>
  <!-- ladder -->
  <line x1="296" y1="420" x2="296" y2="258" stroke="#dc2626" stroke-width="6"/>
  <line x1="272" y1="300" x2="296" y2="300" stroke="#dc2626" stroke-width="5"/>
  <line x1="272" y1="330" x2="296" y2="330" stroke="#dc2626" stroke-width="5"/>
  <line x1="272" y1="360" x2="296" y2="360" stroke="#dc2626" stroke-width="5"/>
  <line x1="272" y1="390" x2="296" y2="390" stroke="#dc2626" stroke-width="5"/>
  <!-- schommelframe -->
  <line x1="480" y1="200" x2="480" y2="420" stroke="#7c3aed" stroke-width="10"/>
  <line x1="640" y1="200" x2="640" y2="420" stroke="#7c3aed" stroke-width="10"/>
  <line x1="480" y1="200" x2="640" y2="200" stroke="#7c3aed" stroke-width="10"/>
  <!-- schommel 1 -->
  <line x1="520" y1="200" x2="520" y2="330" stroke="#374151" stroke-width="4"/>
  <rect x="500" y="330" width="40" height="14" rx="4" fill="#4ade80"/>
  <!-- schommel 2 -->
  <line x1="600" y1="200" x2="600" y2="340" stroke="#374151" stroke-width="4"/>
  <rect x="580" y="340" width="40" height="14" rx="4" fill="#fb923c"/>
  <!-- kind op schommel 2 -->
  <circle cx="600" cy="318" r="18" fill="#fbbf24"/>
  <rect x="588" y="334" width="24" height="32" rx="6" fill="#ef4444"/>
  <!-- kind met armen omhoog op glijbaan -->
  <circle cx="252" cy="228" r="18" fill="#a78bfa"/>
  <rect x="240" y="244" width="24" height="30" rx="6" fill="#2563eb"/>
  <!-- kind op gras -->
  <circle cx="420" cy="408" r="18" fill="#fca5a5"/>
  <rect x="408" y="424" width="24" height="30" rx="6" fill="#16a34a"/>
  <!-- zandbak -->
  <ellipse cx="150" cy="450" rx="100" ry="30" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <!-- zandbak speelgoed -->
  <rect x="110" y="435" width="20" height="20" rx="2" fill="#ef4444"/>
  <rect x="155" y="437" width="16" height="18" rx="2" fill="#3b82f6"/>
</svg>
