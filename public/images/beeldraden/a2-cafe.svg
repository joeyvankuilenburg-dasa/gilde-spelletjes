<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Een gezellig café met mensen die koffie drinken">
  <rect width="800" height="600" fill="#fef3c7"/>
  <!-- vloer -->
  <rect x="0" y="480" width="800" height="120" fill="#d6d3d1"/>
  <!-- muur achter -->
  <rect x="0" y="0" width="800" height="480" fill="#fef9c3"/>
  <!-- raam links -->
  <rect x="40" y="80" width="200" height="260" rx="6" fill="#bae6fd" stroke="#78716c" stroke-width="5"/>
  <line x1="140" y1="80" x2="140" y2="340" stroke="#78716c" stroke-width="3"/>
  <line x1="40" y1="210" x2="240" y2="210" stroke="#78716c" stroke-width="3"/>
  <!-- raam rechts -->
  <rect x="560" y="80" width="200" height="260" rx="6" fill="#bae6fd" stroke="#78716c" stroke-width="5"/>
  <line x1="660" y1="80" x2="660" y2="340" stroke="#78716c" stroke-width="3"/>
  <line x1="560" y1="210" x2="760" y2="210" stroke="#78716c" stroke-width="3"/>
  <!-- bord op muur -->
  <rect x="320" y="60" width="160" height="80" rx="6" fill="#78350f"/>
  <text x="400" y="95" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fde68a">CAFÉ</text>
  <text x="400" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fde68a">Welkom!</text>
  <!-- toonbank -->
  <rect x="260" y="340" width="280" height="140" rx="4" fill="#92400e"/>
  <rect x="255" y="330" width="290" height="20" rx="3" fill="#78350f"/>
  <!-- koffiemachine -->
  <rect x="310" y="270" width="80" height="70" rx="6" fill="#374151"/>
  <circle cx="350" cy="295" r="18" fill="#1f2937"/>
  <circle cx="350" cy="295" r="10" fill="#6b7280"/>
  <rect x="335" y="330" width="30" height="10" rx="2" fill="#6b7280"/>
  <!-- tafel links -->
  <ellipse cx="130" cy="485" rx="90" ry="22" fill="#92400e"/>
  <rect x="120" y="485" width="20" height="80" fill="#78350f"/>
  <!-- tafel rechts -->
  <ellipse cx="670" cy="485" rx="90" ry="22" fill="#92400e"/>
  <rect x="660" y="485" width="20" height="80" fill="#78350f"/>
  <!-- kopje links -->
  <ellipse cx="100" cy="472" rx="22" ry="8" fill="#f3f4f6"/>
  <rect x="80" y="464" width="42" height="16" rx="4" fill="white"/>
  <ellipse cx="101" cy="464" rx="18" ry="6" fill="#d97706"/>
  <!-- kopje rechts -->
  <ellipse cx="700" cy="472" rx="22" ry="8" fill="#f3f4f6"/>
  <rect x="680" y="464" width="42" height="16" rx="4" fill="white"/>
  <ellipse cx="701" cy="464" rx="18" ry="6" fill="#d97706"/>
  <!-- persoon links (gestileerd) -->
  <circle cx="130" cy="395" r="28" fill="#fbbf24"/>
  <rect x="108" y="420" width="44" height="55" rx="8" fill="#2563eb"/>
  <!-- persoon rechts -->
  <circle cx="670" cy="395" r="28" fill="#a78bfa"/>
  <rect x="648" y="420" width="44" height="55" rx="8" fill="#ef4444"/>
  <!-- stoelen -->
  <rect x="60" y="490" width="50" height="10" rx="3" fill="#6b7280"/>
  <rect x="70" y="500" width="8" height="40" fill="#6b7280"/>
  <rect x="102" y="500" width="8" height="40" fill="#6b7280"/>
  <rect x="690" y="490" width="50" height="10" rx="3" fill="#6b7280"/>
  <rect x="700" y="500" width="8" height="40" fill="#6b7280"/>
  <rect x="732" y="500" width="8" height="40" fill="#6b7280"/>
</svg>
